# LetsGo web + team api on ONE origin (referenced by docker-compose.yml's
# `web` service). Serving both from the same origin keeps the session cookie
# first-party — no CORS, no third-party-cookie trouble.

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Vite emits content-hashed bundles under /assets/ — safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html and the service worker are the only unhashed entry points, so
    # they must always revalidate — otherwise a browser can stay pinned to an
    # old index.html (and its stale bundle hashes) across a redeploy.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback so client-side routes (#/... and deep links) resolve.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }

    # Team API — proxied to the api container. The /api prefix is preserved
    # (proxy_pass without a URI part forwards the original request path).
    location /api/ {
        proxy_pass http://api:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
